services:
  app:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      DATABASE_URL: postgres://atlas:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/atlas?sslmode=disable
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /app/data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - atlas_app:/app/data
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - atlas_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  atlas_db:
  atlas_app:

